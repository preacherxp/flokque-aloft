[package]
name = "flokque-aloft"
version = "1.0.0"
description = "Keeps your computer working with the lid closed"
license = "MIT"
repository = "https://github.com/preacherxp/flokque-aloft"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSGeometry", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSCell", "NSControl", "NSGraphics", "NSImage", "NSImageView", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Registry"] }

[profile.release]
lto = true
strip = true
